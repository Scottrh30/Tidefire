# Builds Tidefire for Windows on every push (or with "Run workflow"):
#   Tidefire.exe          the app (Tauri + Leptos; the engine runs on the GPU through WebGPU in WebView2)
#   Tidefire-setup.exe    its installer
#   tidefire-cli.exe      headless batch renders and visual tests
# Builds of main are published as the "latest" release. A second job opens the
# interface in Chromium (software WebGPU) and publishes screenshots as the
# "preview" release, so the interface can be checked without a Windows machine.
name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A small static ffmpeg (H.264 + ProRes only, ~4 MB) for video export,
  # cross-compiled once and cached; it is embedded in Tidefire.exe.
  ffmpeg:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      # computed here and passed on, since Windows checkouts can change line endings
      - id: key
        run: echo "key=ffmpeg-win64-${{ hashFiles('ci/build-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-out
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
      - name: Build ffmpeg.exe
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 nasm > /dev/null
          ci/build-ffmpeg.sh windows ffmpeg-out

  build:
    runs-on: windows-latest
    needs: ffmpeg
    steps:
      - uses: actions/checkout@v4
      # handed over through the cache (not artifacts, which count against storage)
      - uses: actions/cache/restore@v4
        with:
          path: ffmpeg-out
          key: ${{ needs.ffmpeg.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Embed ffmpeg
        shell: pwsh
        run: echo "TIDEFIRE_FFMPEG_EMBED=$((Resolve-Path ffmpeg-out/ffmpeg.exe).Path)" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the command line tool
        run: cargo build --release --locked -p tidefire-cli
      - name: Build the Tauri app
        run: npx --yes @tauri-apps/cli@2 build
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tidefire.exe dist/Tidefire.exe
          Copy-Item target/release/tidefire-cli.exe dist/tidefire-cli.exe
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist/Tidefire-setup.exe
          Get-ChildItem dist
      # The release below is the real download; a full artifact store must not block it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tidefire-windows-x64
          path: dist/
          retention-days: 7
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tidefire (latest build)
          body: |
            Windows builds of the newest commit on main.
            - Tidefire.exe: the app (Tauri + Leptos). Run it directly; it uses WebView2 (built into Windows 10 and 11) and needs a GPU with WebGPU support.
            - Tidefire-setup.exe: installs it with a Start menu entry and .tidefire file association.
            - tidefire-cli.exe: headless renders (`--headless`, PNG / `--format mp4` / `--format prores`) and visual tests (`--visual-test`).
            Video export (.mp4 H.264 and ProRes .mov) uses a small ffmpeg built into both programs. That ffmpeg includes x264 and so is GPL-licensed.
          prerelease: false
          make_latest: true
          files: |
            dist/Tidefire.exe
            dist/Tidefire-setup.exe
            dist/tidefire-cli.exe

  web-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the web interface
        working-directory: app
        run: trunk build --release
      - name: Screenshots
        run: |
          npm init -y > /dev/null
          npm install playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          (cd app/dist && python3 -m http.server 8080 > /dev/null 2>&1 &)
          sleep 2
          node ci/preview.mjs http://localhost:8080/ preview
          ls preview
          grep -q PASS preview/video-export-check.txt
      - name: Publish preview
        if: always() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Interface preview (screenshots)
          body: Screenshots of the newest web build (${{ github.sha }}), taken in Chromium on Linux with software WebGPU.
          prerelease: true
          make_latest: false
          files: preview/*
