name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tidefire.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath tidefire-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: tidefire-windows-x64
          path: tidefire-windows-x64.zip
          retention-days: 7
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tidefire-windows-x64.zip
