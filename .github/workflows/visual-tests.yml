name: Visual tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1
      - name: Build
        run: cargo build --release --locked -p tidefire-cli
      - name: Render presets and compare with references
        env:
          WGPU_BACKEND: vulkan
        run: ./target/release/tidefire-cli --visual-test tests/visual
      - name: Upload renders and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-output
          path: tests/visual/out/
          retention-days: 3
