[package]
name = "tidefire-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tidefire's Leptos interface (runs in the Tauri window; the engine runs on the GPU through WebGPU)"

[dependencies]
tidefire-core = { path = "../core" }
leptos = { version = "0.8", features = ["csr"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu"] }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
base64 = "0.22"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlSelectElement",
    "DomRect", "PointerEvent", "MouseEvent", "WheelEvent", "KeyboardEvent", "Event", "EventTarget", "Navigator",
    "CssStyleDeclaration", "Performance", "Storage", "console",
] }
