[package]
name = "tidefire"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
glam = { version = "0.34.3", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
