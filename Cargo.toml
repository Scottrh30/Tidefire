[workspace]
resolver = "3"
members = ["core", "cli", "app", "src-tauri"]
# `cargo build` / `cargo test` on their own cover the engine and the command line tool;
# the interface is built by Trunk (WebAssembly) and the window by the Tauri CLI.
default-members = ["core", "cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = "30"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep debug builds usable: optimise dependencies (wgpu, Leptos) even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
